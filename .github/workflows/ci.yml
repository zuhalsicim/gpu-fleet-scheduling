name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and queueing-theory tests
        run: pytest -q
      - name: README tables match results/
        run: python scripts/make_tables.py --check
      - name: Smoke run of every experiment on the committed six-hour sample
        run: |
          python -m fleetsim.experiments --sample --seeds 2 --workers 2
          python -m fleetsim.validate --reps 4 --jobs 4000 --out results-sample/validation.json
          python scripts/make_tables.py --results results-sample --readme README.md --check-structure
